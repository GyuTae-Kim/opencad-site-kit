name: 버그 신고 (Bug report)
description: 임베드 요소나 사이트 도구가 안내와 다르게 동작할 때 (When the embed element or site tools misbehave)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        한국어나 영어로 쓰시면 됩니다. CAD 파일을 잘못 읽는 문제는 각 앱 저장소(opencad-step·opencad-skp·opencad-nc·opencad-dwgdxf)에 올려 주십시오.
        보안 문제는 이슈 대신 [비공개 신고](https://github.com/GyuTae-Kim/opencad-site-kit/security/advisories/new)를 써 주십시오.
        (Korean or English is fine. File-parsing bugs belong in each app repository. Report security issues privately.)
  - type: dropdown
    id: area
    attributes:
      label: 어디에서 (Area)
      options:
        - "임베드 요소 <opencad-viewer> (embed element)"
        - "앱 쪽 수신기 acceptEmbeddedFiles (app-side receiver)"
        - "다국어 페이지·검색 정보 (i18n, SEO)"
        - "서비스 워커·홈 화면 앱 (PWA)"
        - "방문 통계 (analytics)"
        - "opencad-site 명령 (CLI)"
        - "기타 (other)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 판 (Version)
      description: 스크립트 주소나 package.json의 태그 (tag in the script URL or package.json)
      placeholder: v0.2.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요 (What happened)
      description: 기대한 것과 실제로 일어난 것 (expected vs. actual)
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법 (How to reproduce)
      description: 임베드라면 요소를 넣은 HTML을 붙여 주십시오 (for the embed, paste the HTML that adds the element)
      render: html
  - type: input
    id: browser
    attributes:
      label: 브라우저와 OS (Browser and OS)
      placeholder: Chrome 131 / macOS 15
  - type: textarea
    id: console
    attributes:
      label: 콘솔 오류나 이벤트 (Console errors or events)
      description: opencad-error의 code, 브라우저 콘솔 오류 (opencad-error code, browser console errors)
      render: text
