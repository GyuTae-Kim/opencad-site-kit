name: 바라는 기능 (Feature request)
description: 임베드나 사이트 도구에 있었으면 하는 것 (Something you'd like the embed or site tools to do)
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 하려는 일 (What you are trying to do)
      description: 어떤 사이트에서 무엇을 하려는지 (the site and what you want to achieve)
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 생각한 방법 (Proposed solution)
      description: 새 속성·이벤트·설정 등 (a new attribute, event, option and so on)
  - type: textarea
    id: workaround
    attributes:
      label: 지금 쓰는 방법 (Current workaround)
