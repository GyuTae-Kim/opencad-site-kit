name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 갈래 비교 시험(test/variants)은 .runtime/variants가 없으면 건너뛴다(앱 원본은 로컬에서 npm run variants로 꺼낸다)
      - run: npm test
